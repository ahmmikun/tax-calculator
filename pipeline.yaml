apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: tax-calculator-pipeline
spec:
  params:
    - name: repo-url
      type: string
      description: GitHub repository URL of the Tax Calculator app
    - name: revision
      type: string
      default: main
    - name: image
      type: string
      description: Full ICR image name, e.g. us.icr.io/<namespace>/tax-calculator
    - name: tag
      type: string
      default: latest
  workspaces:
    - name: shared-workspace
  tasks:
    - name: clone
      taskRef:
        name: git-clone-tax
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: shared-workspace
    - name: npminstall
      runAfter: [clone]
      taskRef:
        name: npm-install
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: tests
      runAfter: [npminstall]
      taskRef:
        name: jasmine-tests
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: build
      runAfter: [tests]
      taskRef:
        name: build-push-icr
      params:
        - name: image
          value: $(params.image)
        - name: tag
          value: $(params.tag)
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: deploy
      runAfter: [build]
      taskRef:
        name: deploy-kubectl
      params:
        - name: image
          value: $(params.image)
        - name: tag
          value: $(params.tag)
      workspaces:
        - name: source
          workspace: shared-workspace
