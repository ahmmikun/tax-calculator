apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: tax-calculator-pipeline
spec:
  params:
    - name: repo-url
      type: string
      description: GitHub repository URL of the Tax Calculator app
    - name: revision
      type: string
      default: main
    - name: image
      type: string
      description: Full ICR image name, e.g. us.icr.io/<CR_NAMESPACE>/tax-calculator
    - name: tag
      type: string
      default: latest
  workspaces:
    - name: shared-workspace
  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone-tax
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: shared-workspace
    - name: unit-tests
      runAfter: [fetch-source]
      taskRef:
        name: jasmine-test
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: build-and-push
      runAfter: [unit-tests]
      taskRef:
        name: build-push-icr
      params:
        - name: image
          value: $(params.image)
        - name: tag
          value: $(params.tag)
      workspaces:
        - name: source
          workspace: shared-workspace
    - name: deploy
      runAfter: [build-and-push]
      taskRef:
        name: deploy-kubectl
      params:
        - name: image
          value: $(params.image)
        - name: tag
          value: $(params.tag)
      workspaces:
        - name: source
          workspace: shared-workspace
