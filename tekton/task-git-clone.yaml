apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: git-clone-tax
spec:
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: output
  steps:
    - name: clone
      image: alpine/git:v2.45.0
      workingDir: $(workspaces.output.path)
      script: |
        #!/bin/sh
        set -e
        rm -rf source
        git clone --branch $(params.revision) $(params.url) source
