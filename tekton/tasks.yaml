apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm-install
spec:
  description: Install the Node.js dependencies for the Tax Calculator app.
  workspaces:
    - name: source
  steps:
    - name: npm
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        npm install
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jasmine-tests
spec:
  description: Run the Jasmine unit tests for the Tax Calculator app.
  workspaces:
    - name: source
  steps:
    - name: jasmine
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        npx jasmine
