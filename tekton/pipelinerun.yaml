apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: tax-calculator-run-
spec:
  pipelineRef:
    name: tax-calculator-pipeline
  params:
    - name: repo-url
      value: https://github.com/<GITHUB_USER>/<GITHUB_REPO>.git
    - name: revision
      value: main
    - name: image
      value: <REGION>.icr.io/<CR_NAMESPACE>/tax-calculator
    - name: tag
      value: latest
  workspaces:
    - name: shared-workspace
      persistentVolumeClaim:
        claimName: build-pvc
  serviceAccountName: default
