apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: tax-calculator-local-run-
spec:
  pipelineRef:
    name: tax-calculator-pipeline
  params:
    - name: repo-url
      value: https://github.com/ahmmikun/tax-calculator.git
    - name: revision
      value: main
    - name: image
      value: localhost:5000/tax-calculator
    - name: tag
      value: latest
  workspaces:
    - name: shared-workspace
      persistentVolumeClaim:
        claimName: build-pvc
  serviceAccountName: default
